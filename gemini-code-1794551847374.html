<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>學霸雲端筆記本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 挖空遮罩樣式 */
    .cloze-mask {
      background-color: #334155;
      color: transparent;
      border-radius: 4px;
      padding: 0 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      border-bottom: 2px dashed #94a3b8;
    }
    .cloze-mask.revealed {
      background-color: #fef08a;
      color: #854d0e;
      font-weight: bold;
      border-bottom: 2px solid #eab308;
    }
    /* 筆記本橫線背景 */
    .lined-paper {
      background-image: linear-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 100% 2rem;
      line-height: 2rem;
    }
  </style>
</head>
<body class="bg-amber-50/60 text-slate-800 min-h-screen font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-amber-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📓</span>
        <h1 class="text-xl font-bold text-slate-800">課業重點隨身筆記</h1>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="toggleQuizBtn" onclick="toggleQuizMode()" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition">
          👁️ 考前抽考模式：關
        </button>
        <button onclick="openModal()" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-amber-500 text-white hover:bg-amber-600 shadow-sm transition">
          + 新增重點
        </button>
      </div>
    </div>

    <!-- 科目分類標籤 -->
    <div class="max-w-5xl mx-auto px-4 py-2 flex gap-2 overflow-x-auto text-sm">
      <button onclick="filterSubject('全部')" class="tab-btn active px-3 py-1 rounded-full bg-slate-800 text-white font-medium">全部</button>
      <button onclick="filterSubject('國文')" class="tab-btn px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-100">📖 國文</button>
      <button onclick="filterSubject('數學')" class="tab-btn px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-100">📐 數學</button>
      <button onclick="filterSubject('歷史')" class="tab-btn px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-100">🏛️ 歷史</button>
      <button onclick="filterSubject('地理')" class="tab-btn px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-100">🌍 地理</button>
      <button onclick="filterSubject('公民')" class="tab-btn px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-100">⚖️ 公民</button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- 搜尋列 -->
    <div class="mb-6">
      <input type="text" id="searchInput" oninput="renderNotes()" placeholder="🔍 搜尋課文、公式、年份、法條關鍵字..." 
        class="w-full px-4 py-2.5 rounded-xl border border-amber-200 bg-white focus:outline-none focus:ring-2 focus:ring-amber-400 shadow-sm">
    </div>

    <!-- 載入中提示 -->
    <div id="loading" class="text-center py-12 text-slate-500">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full mb-2"></div>
      <p>正在從 Google 試算表讀取筆記...</p>
    </div>

    <!-- 筆記卡片列表 -->
    <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
  </main>

  <!-- 新增/編輯筆記彈窗 -->
  <div id="noteModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 id="modalTitle" class="text-lg font-bold">新增課業重點</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">×</button>
      </div>

      <input type="hidden" id="noteId">
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">科目</label>
          <select id="noteSubject" onchange="applyTemplate()" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
            <option value="國文">📖 國文</option>
            <option value="數學">📐 數學</option>
            <option value="歷史">🏛️ 歷史</option>
            <option value="地理">🌍 地理</option>
            <option value="公民">⚖️ 公民</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs font-bold text-slate-600 mb-1">單元 / 標題</label>
          <input type="text" id="noteTitle" placeholder="例如：師說課文概要、二次函數頂點式..." class="w-full border border-slate-300 rounded-lg p-2 text-sm">
        </div>
      </div>

      <div class="mb-4">
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-600">重點內容</label>
          <button type="button" onclick="insertTemplateForce()" class="text-xs text-amber-600 hover:underline">套用該科筆記模板</button>
        </div>
        <textarea id="noteContent" rows="8" class="w-full border border-slate-300 rounded-lg p-3 text-sm lined-paper focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="在這裡寫下你的重點..."></textarea>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-bold text-slate-600 mb-1">🎯 考前挖空關鍵字（用逗號分隔）</label>
        <input type="text" id="noteKeyPoints" placeholder="例如：韓愈, 傳道受業解惑, 1895年, 18歲" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-indigo-50/50">
        <p class="text-xs text-slate-500 mt-1">開啟「考前抽考模式」時，內容中出現的這些詞彙會自動變成黑色遮罩，點擊即可看答案！</p>
      </div>

      <div class="flex justify-end gap-2">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">取消</button>
        <button id="saveBtn" onclick="submitNote()" class="px-5 py-2 rounded-lg text-sm font-medium bg-amber-500 text-white hover:bg-amber-600">儲存到雲端</button>
      </div>
    </div>
  </div>

  <script>
    let allNotes = [];
    let currentSubject = '全部';
    let isQuizMode = false;

    const subjectColors = {
      '國文': 'bg-rose-100 text-rose-800 border-rose-200',
      '數學': 'bg-blue-100 text-blue-800 border-blue-200',
      '歷史': 'bg-amber-100 text-amber-800 border-amber-200',
      '地理': 'bg-emerald-100 text-emerald-800 border-emerald-200',
      '公民': 'bg-purple-100 text-purple-800 border-purple-200'
    };

    const templates = {
      '國文': '【作者與出處】\n【主旨大意】\n【重要修辭】\n【形音義重點】',
      '數學': '【核心公式】\n【適用條件】\n【易錯提醒】\n【經典例題解法】',
      '歷史': '【時代背景】\n【重要年份與事件】\n- 年份：\n【影響與意義】',
      '地理': '【地理位置與範圍】\n【氣候與地形特徵】\n【人文與產業重點】',
      '公民': '【相關法條/制度】\n【構成要件】\n【權利與救濟途徑】'
    };

    // 初始化讀取資料
    window.onload = () => {
      google.script.run.withSuccessHandler(onDataLoaded).getNotes();
    };

    function onDataLoaded(notes) {
      allNotes = notes;
      document.getElementById('loading').classList.add('hidden');
      renderNotes();
    }

    function filterSubject(subject) {
      currentSubject = subject;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.innerText.includes(subject)) {
          btn.className = 'tab-btn active px-3 py-1 rounded-full bg-slate-800 text-white font-medium';
        } else {
          btn.className = 'tab-btn px-3 py-1 rounded-full bg-white border border-slate-200 hover:bg-slate-100';
        }
      });
      renderNotes();
    }

    function toggleQuizMode() {
      isQuizMode = !isQuizMode;
      const btn = document.getElementById('toggleQuizBtn');
      if (isQuizMode) {
        btn.innerText = '🙈 考前抽考模式：開（點擊黑塊看答案）';
        btn.className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600 text-white shadow-sm transition';
      } else {
        btn.innerText = '👁️ 考前抽考模式：關';
        btn.className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition';
      }
      renderNotes();
    }

    function formatContent(content, keyPointsStr) {
      let escaped = content.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
      if (isQuizMode && keyPointsStr) {
        const keys = keyPointsStr.split(/[,，]/).map(k => k.trim()).filter(k => k);
        // 依長度排序避免短詞先取代長詞
        keys.sort((a, b) => b.length - a.length);
        keys.forEach(key => {
          const safeKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(safeKey, 'g');
          escaped = escaped.replace(regex, `<span class="cloze-mask" onclick="this.classList.toggle('revealed')">${key}</span>`);
        });
      }
      return escaped.replace(/\n/g, '<br>');
    }

    function renderNotes() {
      const grid = document.getElementById('notesGrid');
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = allNotes.filter(n => {
        const matchSub = currentSubject === '全部' || n.subject === currentSubject;
        const matchKey = !keyword || 
          n.title.toLowerCase().includes(keyword) || 
          n.content.toLowerCase().includes(keyword);
        return matchSub && matchKey;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">目前沒有符合的筆記，點擊右上角「+ 新增重點」開始建立吧！</div>`;
        return;
      }

      filtered.forEach(note => {
        const badgeClass = subjectColors[note.subject] || 'bg-slate-100 text-slate-800';
        const formattedHtml = formatContent(note.content, note.keyPoints);
        
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-5 border border-amber-200/80 shadow-sm hover:shadow-md transition flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2 mb-3">
              <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${badgeClass}">${note.subject}</span>
              <div class="flex gap-2 text-xs text-slate-400">
                <button onclick='editNote(${JSON.stringify(note).replace(/'/g, "'")})' class="hover:text-amber-600">編輯</button>
                <button onclick="removeNote('${note.id}')" class="hover:text-red-600">刪除</button>
              </div>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-2">${note.title}</h3>
            <div class="text-sm text-slate-700 leading-relaxed bg-amber-50/40 p-3.5 rounded-xl border border-amber-100/80">
              ${formattedHtml}
            </div>
          </div>
          <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
            <span>${note.keyPoints ? '🎯 含 ' + note.keyPoints.split(/[,，]/).filter(k=>k.trim()).length + ' 個抽考詞' : '一般筆記'}</span>
            <span>更新：${note.updatedAt}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal() {
      document.getElementById('modalTitle').innerText = '新增課業重點';
      document.getElementById('noteId').value = '';
      document.getElementById('noteSubject').value = currentSubject === '全部' ? '國文' : currentSubject;
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = templates[document.getElementById('noteSubject').value];
      document.getElementById('noteKeyPoints').value = '';
      document.getElementById('noteModal').classList.remove('hidden');
      document.getElementById('noteModal').classList.add('flex');
    }

    function editNote(note) {
      document.getElementById('modalTitle').innerText = '編輯課業重點';
      document.getElementById('noteId').value = note.id;
      document.getElementById('noteSubject').value = note.subject;
      document.getElementById('noteTitle').value = note.title;
      document.getElementById('noteContent').value = note.content;
      document.getElementById('noteKeyPoints').value = note.keyPoints || '';
      document.getElementById('noteModal').classList.remove('hidden');
      document.getElementById('noteModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('noteModal').classList.add('hidden');
      document.getElementById('noteModal').classList.remove('flex');
    }

    function applyTemplate() {
      if (!document.getElementById('noteId').value && !document.getElementById('noteTitle').value) {
        insertTemplateForce();
      }
    }

    function insertTemplateForce() {
      const sub = document.getElementById('noteSubject').value;
      document.getElementById('noteContent').value = templates[sub] || '';
    }

    function submitNote() {
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();
      if (!title || !content) {
        alert('請填寫標題與重點內容！');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = '儲存中...';

      const noteObj = {
        id: document.getElementById('noteId').value,
        subject: document.getElementById('noteSubject').value,
        title: title,
        content: content,
        keyPoints: document.getElementById('noteKeyPoints').value.trim()
      };

      google.script.run.withSuccessHandler(notes => {
        btn.disabled = false;
        btn.innerText = '儲存到雲端';
        closeModal();
        onDataLoaded(notes);
      }).saveNote(noteObj);
    }

    function removeNote(id) {
      if (!confirm('確定要刪除這篇筆記嗎？')) return;
      document.getElementById('loading').classList.remove('hidden');
      google.script.run.withSuccessHandler(onDataLoaded).deleteNote(id);
    }
  </script>
</body>
</html>
